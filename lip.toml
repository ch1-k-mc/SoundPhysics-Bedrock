format = 4
id = "github.com/ch1-k-mc/SoundPhysics-Bedrock"
version = "0.1.0"

[info]
name = "SoundPhysics"
description = "An unofficial Bedrock Edition (LeviLamina) port of the Java Edition mod Sound Physics Remastered: realistic sound occlusion, reverb and absorption through blocks."
tags = ["platform:levilamina", "type:mod", "client", "audio", "immersive"]
logo = "https://raw.githubusercontent.com/ch1-k-mc/SoundPhysics-Bedrock/main/docs/images/icon.png"

# Client only. LeviLamina 26.60 has no "client" variant: the entry is picked by side.
[[variants.""]]
side = "client"
platform = "win-x64"
preserve = [
    "mods/SoundPhysics/config/soundphysics.properties",
    "mods/SoundPhysics/config/reflectivity.properties",
    "mods/SoundPhysics/config/occlusion.properties",
    "mods/SoundPhysics/config/sound_rates.properties",
]

[variants."".deps]
"github.com/LiteLDev/LeviLamina" = ">26.60.6 <26.61.0"

[[variants."".assets]]
type = "zip"
urls = ["https://{{id}}/releases/download/v{{version}}/SoundPhysics-client-windows-x64.zip"]
place = [{ src = "SoundPhysics/", dest = "mods/SoundPhysics/" }]
